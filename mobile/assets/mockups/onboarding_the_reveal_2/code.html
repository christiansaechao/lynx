amond"], "body-sm": ["Hanken Grotesk"], "display-lg-mobile": ["EB Garamond"], "body-lg": ["Hanken Grotesk"], "label-caps": ["Hanken Grotesk"] }, "fontSize": { "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "display-lg-mobile": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400" }], "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.15em", "fontWeight": "700" }] } } } };</script></head><body class="bg-background min-h-screen"><main class="w-full"><div class="flex flex-col w-full h-full justify-center items-center relative overflow-hidden bg-background">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container/20 via-background to-background pointer-events-none"></div>
<div class="w-full max-w-[600px] px-xxl relative z-10 flex flex-col items-center">
<div class="w-full aspect-[1.75/1] relative mb-xl cursor-grab active:cursor-grabbing group" id="card-container" style="perspective: 1000px;">
<div class="w-full h-full relative transition-transform duration-700 ease-out preserve-3d" id="card-inner">
<div class="absolute inset-0 w-full h-full bg-[#FBFAF5] flex flex-col justify-between p-xl shadow-2xl backface-hidden border-[1px] border-[#E5E4DF]">
<div class="absolute inset-0 opacity-30 pointer-events-none mix-blend-multiply" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<div class="flex flex-col relative z-10">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-[#1A1A1A] tracking-tighter leading-none mb-sm">Patrick Bateman</h1>
<p class="font-body-sm text-body-sm text-[#4A4A4A] uppercase tracking-widest">Vice President</p>
</div>
<div class="flex justify-between items-end relative z-10 w-full">
<div class="flex flex-col">
<p class="font-body-sm text-body-sm text-[#4A4A4A]">Pierce & Pierce</p>
<p class="font-body-sm text-body-sm text-[#4A4A4A]">Mergers and Acquisitions</p>
</div>
<img alt="Lynx Logo" class="w-12 h-12 object-contain mix-blend-difference filter invert" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmV1D1BJr5-CqagA7sI5nW10bm8cxkAhcM7RBDY_YrorqGdSwu16zgAEHlVx6h8nzNQlY1n7svVLboeNF-pSICZ1F99V6HvFuAs2EK6103efEstinRG4LMrVYL3QkHatjbqYxIKpWHhcq-CtY4HUKCFBbCdTb2-BJTg4mU9A97couJYY2FSUSKUIaoNNswvjX2cU1SiPNZzomuRYedVIZBq1FbdA8rjoZOy4-TtEeXCq121z9pOLdN"/>
</div>
</div>
<div class="absolute inset-0 w-full h-full bg-[#FBFAF5] flex flex-col justify-center items-center p-xl shadow-2xl backface-hidden border-[1px] border-[#E5E4DF] rotate-y-180">
<div class="absolute inset-0 opacity-30 pointer-events-none mix-blend-multiply" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<div class="w-24 h-24 bg-[#1A1A1A] flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-primary text-[48px]">qr_code_scanner</span>
</div>
<p class="font-label-caps text-label-caps text-[#4A4A4A] mt-lg relative z-10">Scan to Connect</p>
</div>
</div>
<div class="absolute -bottom-4 right-0 w-full h-4 bg-black/50 blur-xl rounded-full transform scale-90 translate-y-8 opacity-60"></div>
</div>
<div class="flex flex-col items-center mt-huge animate-pulse-slow opacity-80" id="tooltip">
<span class="material-symbols-outlined text-on-background text-2xl mb-sm transform -rotate-90">swipe</span>
<p class="font-label-caps text-label-caps text-on-background uppercase tracking-widest text-center">Swipe to flip</p>
</div>
</div>
<div class="absolute bottom-huge left-0 right-0 flex justify-center z-20">
<button class="w-12 h-12 rounded-full border border-outline flex items-center justify-center text-on-background hover:bg-surface-container transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<style>
  .preserve-3d {
    transform-style: preserve-3d;
  }
  .backface-hidden {
    backface-visibility: hidden;
  }
  .rotate-y-180 {
    transform: rotateY(180deg);
  }
  @keyframes pulse-slow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .animate-pulse-slow {
    animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
</style>
<script>
  const cardContainer = document.getElementById('card-container');
  const cardInner = document.getElementById('card-inner');
  const tooltip = document.getElementById('tooltip');
  
  let isFlipped = false;
  let startX = 0;
  let currentX = 0;
  let isDragging = false;
  
  const updateRotation = (x) => {
      const baseRotation = isFlipped ? 180 : 0;
      const rotation = baseRotation + (x * 0.5); 
      cardInner.style.transform = `rotateY(${rotation}deg)`;
  };

  cardContainer.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX;
    cardInner.style.transition = 'none';
    tooltip.style.opacity = '0';
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    currentX = e.clientX - startX;
    updateRotation(currentX);
  });

  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    cardInner.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
    
    if (Math.abs(currentX) > 50) {
      isFlipped = !isFlipped;
    }
    
    cardInner.style.transform = `rotateY(${isFlipped ? 180 : 0}deg)`;
    currentX = 0;
    
    setTimeout(() => {
        tooltip.style.opacity = '0.8';
        tooltip.querySelector('p').textContent = isFlipped ? "Swipe to view front" : "Swipe to flip";
    }, 600);
  });
  
  // Touch support
  cardContainer.addEventListener('touchstart', (e) => {
    isDragging = true;
    startX = e.touches[0].clientX;
    cardInner.style.transition = 'none';
    tooltip.style.opacity = '0';
  }, {passive: true});

  window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    currentX = e.touches[0].clientX - startX;
    updateRotation(currentX);
  }, {passive: true});

  window.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    cardInner.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
    
    if (Math.abs(currentX) > 30) {
      isFlipped = !isFlipped;
    }
    
    cardInner.style.transform = `rotateY(${isFlipped ? 180 : 0}deg)`;
    currentX = 0;
    
    setTimeout(() => {
        tooltip.style.opacity = '0.8';
        tooltip.querySelector('p').textContent = isFlipped ? "Swipe to view front" : "Swipe to flip";
    }, 600);
  });
</script></main></body></html>
