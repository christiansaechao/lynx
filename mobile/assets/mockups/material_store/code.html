<script>
  document.addEventListener('DOMContentLoaded', () => {
    const swatches = document.querySelectorAll('.material-swatch:not([disabled]) .card-container');
    
    swatches.forEach(container => {
      const card = container.querySelector('.card-face');
      const shimmer = container.querySelector('.shimmer-layer');
      
      container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = ((y - centerY) / centerY) * -10; // Max tilt 10deg
        const rotateY = ((x - centerX) / centerX) * 10;
        
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        
        if (shimmer) {
          const moveX = (x / rect.width) * 100;
          const moveY = (y / rect.height) * 100;
          shimmer.style.backgroundPosition = `${moveX}% ${moveY}%`;
        }
      });
      
      container.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        card.style.transition = 'transform 0.5s cubic-bezier(0.23, 1, 0.32, 1)';
        setTimeout(() => {
          card.style.transition = '';
        }, 500);
      });
    });
  });
