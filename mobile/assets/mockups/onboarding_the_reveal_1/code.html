<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&amp;family=Hanken+Grotesk:wght@400;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed": "#e3e3de", "on-primary-container": "#636565", "on-secondary-fixed-variant": "#43474c", "surface-container-high": "#292a2d", "background": "#121316", "on-secondary": "#2c3136", "surface-dim": "#121316", "surface-container-lowest": "#0d0e11", "on-error": "#690005", "surface-container-low": "#1a1b1e", "tertiary-container": "#e3e3de", "secondary-fixed": "#dfe3e9", "primary": "#ffffff", "outline-variant": "#444748", "inverse-surface": "#e3e2e6", "error": "#ffb4ab", "on-primary-fixed-variant": "#454747", "primary-fixed-dim": "#c6c6c7", "on-tertiary": "#30312e", "on-primary-fixed": "#1a1c1c", "tertiary-fixed-dim": "#c7c7c2", "tertiary": "#ffffff", "on-surface-variant": "#c4c7c8", "on-error-container": "#ffdad6", "on-surface": "#e3e2e6", "inverse-on-surface": "#2f3033", "surface-container": "#1e2022", "primary-fixed": "#e2e2e2", "secondary-fixed-dim": "#c3c7cd", "on-secondary-fixed": "#171c21", "on-primary": "#2f3131", "error-container": "#93000a", "surface-variant": "#343538", "on-tertiary-fixed": "#1b1c19", "surface-container-highest": "#343538", "on-secondary-container": "#b5b9bf", "primary-container": "#e2e2e2", "surface-bright": "#38393c", "secondary": "#c3c7cd", "outline": "#8e9192", "surface": "#121316", "on-tertiary-fixed-variant": "#464744", "secondary-container": "#45494f", "inverse-primary": "#5d5f5f", "surface-tint": "#c6c6c7", "on-tertiary-container": "#646561", "on-background": "#e3e2e6" }, "borderRadius": { "DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px" }, "spacing": { "xs": "2px", "sm": "4px", "lg": "16px", "xl": "24px", "huge": "64px", "xxl": "32px", "md": "8px" }, "fontFamily": { "label-caps": ["Hanken Grotesk"], "body-sm": ["Hanken Grotesk"], "display-lg": ["EB Garamond"], "display-lg-mobile": ["EB Garamond"], "body-lg": ["Hanken Grotesk"], "headline-md": ["EB Garamond"] }, "fontSize": { "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.15em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "display-lg-mobile": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "500" }] } } } };</script><style>@layer base { body { background-color: #000000; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; } } ::-webkit-scrollbar { display: none; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="text-on-surface"><main class="relative min-h-screen bg-black overflow-hidden"><div class="flex flex-col w-full h-full justify-center items-center relative overflow-hidden" id="reveal-container">
<!-- Ambient Void Glow (Subtle) -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-dim to-background opacity-20 pointer-events-none"></div>
<!-- Tooltip -->
<div class="absolute top-[20%] left-1/2 -translate-x-1/2 text-center pointer-events-none z-10 transition-opacity duration-700 opacity-100" id="tooltip">
<div class="flex items-center space-x-sm bg-surface-container/30 px-lg py-md backdrop-blur-sm border-[1px] border-surface-container-high text-on-surface-variant font-label-caps tracking-widest text-[10px] animate-pulse">
<span class="material-symbols-outlined text-[16px]">swipe_right</span>
<span>Swipe to flip</span>
</div>
</div>
<!-- Card Container -->
<div class="relative w-[600px] max-w-[90vw] aspect-[1.586/1] perspective-1000 mt-xl cursor-pointer" id="card-wrapper" style="perspective: 1500px;">
<!-- The Object (Card) -->
<div class="relative w-full h-full transform-style-3d transition-transform duration-700 ease-[cubic-bezier(0.23,1,0.32,1)]" id="card">
<!-- Front -->
<div class="absolute inset-0 backface-hidden w-full h-full bg-gradient-to-br from-[#FBFAF5] to-[#E9E3D6] shadow-[inset_0_0_0_1px_rgba(255,255,255,0.8),0_20px_40px_-10px_rgba(0,0,0,0.8)] overflow-hidden">
<!-- Paper Grain Texture (Simulated) -->
<div class="absolute inset-0 opacity-30 mix-blend-multiply" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<!-- Light Glare (Dynamic) -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/40 to-transparent translate-x-[-100%] transition-transform duration-500 pointer-events-none" id="glare"></div>
<!-- Content -->
<div class="relative z-10 w-full h-full flex flex-col justify-between p-huge">
<div class="flex flex-col items-start space-y-md">
<!-- Embossed Effect (Simulated via text-shadow) -->
<h1 class="font-display-lg text-[#1A1A1A] leading-none tracking-tighter" style="text-shadow: 1px 1px 0px rgba(255,255,255,0.8), -1px -1px 0px rgba(0,0,0,0.1);">
                            Eleanor Vance
                        </h1>
<p class="font-label-caps text-[#4A4A4A] tracking-[0.2em] uppercase mt-xs border-b-[1px] border-[#1A1A1A] pb-sm inline-block">
                            Director of Design
                        </p>
</div>
<div class="flex justify-between items-end w-full">
<div class="font-body-sm text-[#4A4A4A] tracking-wider leading-relaxed">
                            Acheron Capital<br/>
                            100 Void Street, Suite 900<br/>
                            New York, NY 10001
                        </div>
<div class="w-12 h-12 bg-[#1A1A1A] flex items-center justify-center rounded-sm">
<!-- Abstract Monogram -->
<svg class="transform -rotate-45" fill="none" height="24" stroke="#FBFAF5" stroke-width="1" viewbox="0 0 24 24" width="24">
<rect height="18" width="18" x="3" y="3"></rect>
<line x1="12" x2="12" y1="3" y2="21"></line>
<line x1="3" x2="21" y1="12" y2="12"></line>
</svg>
</div>
</div>
</div>
</div>
<!-- Back -->
<div class="absolute inset-0 backface-hidden w-full h-full bg-[#1A1A1A] rotate-y-180 shadow-[inset_0_0_0_1px_rgba(255,255,255,0.1),0_20px_40px_-10px_rgba(0,0,0,0.8)] flex items-center justify-center flex-col p-huge">
<div class="absolute inset-0 opacity-10 mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<svg class="mb-xl animate-[spin_10s_linear_infinite]" fill="none" height="64" stroke="#FBFAF5" stroke-width="0.5" viewbox="0 0 24 24" width="64">
<circle cx="12" cy="12" r="10"></circle>
<circle cx="12" cy="12" r="6" stroke-dasharray="2 2"></circle>
<circle cx="12" cy="12" r="2"></circle>
</svg>
<p class="font-label-caps text-[#FBFAF5] tracking-widest text-center opacity-70">
                    Scan to Connect
                </p>
</div>
</div>
</div>
<!-- Actions (Bottom) -->
<div class="absolute bottom-huge left-0 right-0 flex justify-center space-x-xl opacity-0 transition-opacity duration-1000 delay-500" id="actions">
<button class="bg-primary text-black font-label-caps px-xl py-lg uppercase tracking-widest hover:bg-surface-tint transition-colors border-[1px] border-primary">
            Save Card
        </button>
<button class="bg-transparent text-primary font-label-caps px-xl py-lg uppercase tracking-widest border-[1px] border-primary hover:bg-white/5 transition-colors">
            Share
        </button>
</div>
</div>
<style>
    /* Custom 3D Utilities */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .rotate-y-0 { transform: rotateY(0deg); }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const card = document.getElementById('card');
        const wrapper = document.getElementById('card-wrapper');
        const glare = document.getElementById('glare');
        const tooltip = document.getElementById('tooltip');
        const actions = document.getElementById('actions');
        
        let isFlipped = false;
        let startX = 0;
        
        // Initial reveal animation
        setTimeout(() => {
            actions.classList.remove('opacity-0');
        }, 800);

        // Hover Effect - Tilt & Glare
        wrapper.addEventListener('mousemove', (e) => {
            if (isFlipped) return; // Disable hover tilt on back for simplicity
            
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left; // x position within the element.
            const y = e.clientY - rect.top;  // y position within the element.
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -10; // Max rotation 10deg
            const rotateY = ((x - centerX) / centerX) * 10;
            
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            // Glare follow
            const glarePercent = (x / rect.width) * 200 - 50;
            glare.style.transform = `translateX(${glarePercent}%) skewX(-20deg)`;
        });
        
        wrapper.addEventListener('mouseleave', () => {
            if (!isFlipped) {
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
                glare.style.transform = `translateX(-100%)`;
            }
        });

        // Swipe / Click to Flip
        const toggleFlip = () => {
            isFlipped = !isFlipped;
            card.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateX(0deg) rotateY(0deg)';
            tooltip.style.opacity = '0'; // Hide tooltip after first interaction
        };

        wrapper.addEventListener('click', toggleFlip);

        // Touch Swipe
        wrapper.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        }, {passive: true});

        wrapper.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            if (Math.abs(endX - startX) > 50) {
                toggleFlip();
            }
        }, {passive: true});
    });
</script></main></body></html>
